<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Escola - Mega Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      color: #333;
    }
    header {
      background-color: #8e44ad;
      color: #fff;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .painel-form {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #dcdde1;
      margin-bottom: 2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .painel-form h2 {
      margin-bottom: 1rem;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    button.btn-cadastrar {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
    }
    button.btn-cadastrar:hover {
      background-color: #219150;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #dcdde1;
    }
    th, td {
      padding: 0.9rem;
      text-align: left;
      border-bottom: 1px solid #f1f2f6;
      font-size: 0.95rem;
    }
    th {
      background-color: #ecf0f1;
      color: #2c3e50;
    }
    .btn-excluir {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-excluir:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Painel de Gestão - Mega Store</h1>
    <p>Adicione ou remova os produtos que aparecerão para os alunos e pais</p>
  </header>

  <div class="container">
    
    <div class="painel-form">
      <h2>Cadastrar Novo Prêmio</h2>
      <div class="form-group">
        <label>Nome do Produto / Prêmio:</label>
        <input type="text" id="input-nome" placeholder="Ex: Livro Turma da Mônica">
      </div>
      <div class="form-group">
        <label>Valor em Pontos:</label>
        <input type="number" id="input-pontos" placeholder="Ex: 10">
      </div>
      <div class="form-group">
        <label>Breve Descrição:</label>
        <textarea id="input-desc" rows="2" placeholder="Ex: Gibi colorido com histórias divertidas."></textarea>
      </div>
      <div class="form-group">
        <label>Link da Imagem (Opcional):</label>
        <input type="text" id="input-imagem" placeholder="Cole o link de uma imagem da internet">
      </div>
      <button class="btn-cadastrar" onclick="adicionarProduto()">Salvar e Publicar na Vitrine</button>
    </div>

    <h2>Produtos Cadastrados Atualmente</h2>
    <table style="margin-top: 1rem;">
      <thead>
        <tr>
          <th>Nome do Produto</th>
          <th>Pontos</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-corpo">
        <!-- Lista gerada via JS -->
      </tbody>
    </table>

  </div>

  <script>
    function obterProdutos() {
      const salvos = localStorage.getItem('mega_store_produtos');
      if (salvos) {
        return JSON.parse(salvos);
      }
      return [
        { id: 1, nome: "Livro Turma da Mônica", pontos: 10, descricao: "Edição especial de historinhas em quadrinhos.", imagem: "https://via.placeholder.com/220x140?text=Livro+Monica" },
        { id: 2, nome: "Caixa de Lápis de Cor (12 cores)", pontos: 15, descricao: "Lápis de cor de ótima qualidade para as atividades.", imagem: "https://via.placeholder.com/220x140?text=Lapis+de+Cor" },
        { id: 3, nome: "Jogo de Canetinhas", pontos: 20, descricao: "Canetinhas hidrográficas coloridas.", imagem: "https://via.placeholder.com/220x140?text=Canetinhas" }
      ];
    }

    function salvarProdutos(produtos) {
      localStorage.setItem('mega_store_produtos', JSON.stringify(produtos));
    }

    function atualizarTabela() {
      const produtos = obterProdutos();
      const corpo = document.getElementById('tabela-corpo');
      corpo.innerHTML = '';

      if (produtos.length === 0) {
        corpo.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #7f8c8d;">Nenhum produto cadastrado.</td></tr>';
        return;
      }

      produtos.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${p.nome}</strong></td>
          <td>⭐ ${p.pontos} pts</td>
          <td>${p.descricao || '-'}</td>
          <td><button class="btn-excluir" onclick="excluirProduto(${p.id})">Excluir</button></td>
        `;
        corpo.appendChild(tr);
      });
    }

    function adicionarProduto() {
      const nome = document.getElementById('input-nome').value.trim();
      const pontos = document.getElementById('input-pontos').value.trim();
      const desc = document.getElementById('input-desc').value.trim();
      const imagem = document.getElementById('input-imagem').value.trim();

      if (!nome || !pontos) {
        alert("Por favor, preencha pelo menos o Nome e o Valor em Pontos!");
        return;
      }

      const produtos = obterProdutos();
      const novoProduto = {
        id: Date.now(),
        nome: nome,
        pontos: parseInt(pontos),
        descricao: desc,
        imagem: imagem || 'https://via.placeholder.com/220x140?text=Mega+Store'
      };

      produtos.push(novoProduto);
      salvarProdutos(produtos);

      // Limpar campos
      document.getElementById('input-nome').value = '';
      document.getElementById('input-pontos').value = '';
      document.getElementById('input-desc').value = '';
      document.getElementById('input-imagem').value = '';

      alert("Produto cadastrado com sucesso!");
      atualizarTabela();
    }

    function excluirProduto(id) {
      if (confirm("Tem certeza que deseja remover este produto da vitrine?")) {
        let produtos = obterProdutos();
        produtos = produtos.filter(p => p.id !== id);
        salvarProdutos(produtos);
        atualizarTabela();
      }
    }

    atualizarTabela();
  </script>
</body>
</html>
